name: Copy original illustrations

on:
  push:
    paths:
      - ".github/workflows/copy-ilustrace.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  copy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out games_gen
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Copy illustrations from chces-mys
        run: |
          git clone --depth 1 https://github.com/artmisanovak-prog/chces-mys.git /tmp/chces-mys
          mkdir -p doma/ilustrace
          cp -a /tmp/chces-mys/doma/ilustrace/. doma/ilustrace/

      - name: Commit copied illustrations
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add doma/ilustrace
          if git diff --cached --quiet; then
            echo "No illustration changes to copy."
            exit 0
          fi
          git commit -m "Copy original illustrations from chces-mys"
          git push
